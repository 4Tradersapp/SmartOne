<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Central do Grupo FortSvig</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell de operação — trilho azul-marinho à esquerda, área de trabalho em papel frio; números em mono tabular, vermelho só para risco */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#EDF0F4; --line:#DADFE7; --line-2:#C7CEDA;
  --ink:#0E1B33; --ink-2:#46536A; --ink-3:#69758A;
  --rail:#0E1B33; --rail-2:#17294B; --on-rail:#E9EEF6; --on-rail-2:#9DAECB;
  --primary:#0E1B33; --on-primary:#FFFFFF; --focus:#1D5FD1;
  --ok:#1E7F47; --ok-bg:#E3F3EA; --warn:#9A6400; --warn-bg:#FBF0DA; --crit:#C8102E; --crit-bg:#FBE4E8; --idle:#7A8496; --idle-bg:#ECEEF2;
  --c1:#B07A00; --c2:#B8338A; --c3:#D9530F; --c4:#1D5FD1;
  --chart-a:#7A8496; --chart-b:#0E1B33; --plate:#1F4FA3;
  --shadow:0 1px 2px rgba(14,27,51,.06),0 4px 14px rgba(14,27,51,.06);
  --font-display:"Saira Semi Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A111E; --surface:#111A29; --surface-2:#172235; --line:#22304A; --line-2:#2E3E5C;
  --ink:#E7ECF4; --ink-2:#AEB9CB; --ink-3:#8593AA;
  --rail:#070D19; --rail-2:#13203A; --on-rail:#E7ECF4; --on-rail-2:#8C9DBA;
  --primary:#E7ECF4; --on-primary:#0A111E; --focus:#5B92F0;
  --ok:#43B97A; --ok-bg:#12301F; --warn:#E3A945; --warn-bg:#33270F; --crit:#F2506A; --crit-bg:#3A1520; --idle:#8593AA; --idle-bg:#1B2537;
  --c1:#C08A0E; --c2:#CC4FA8; --c3:#E0621F; --c4:#4C86E8;
  --chart-a:#8593AA; --chart-b:#7FA8F2; --plate:#4A7BD6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0A111E; --surface:#111A29; --surface-2:#172235; --line:#22304A; --line-2:#2E3E5C;
  --ink:#E7ECF4; --ink-2:#AEB9CB; --ink-3:#8593AA;
  --rail:#070D19; --rail-2:#13203A; --on-rail:#E7ECF4; --on-rail-2:#8C9DBA;
  --primary:#E7ECF4; --on-primary:#0A111E; --focus:#5B92F0;
  --ok:#43B97A; --ok-bg:#12301F; --warn:#E3A945; --warn-bg:#33270F; --crit:#F2506A; --crit-bg:#3A1520; --idle:#8593AA; --idle-bg:#1B2537;
  --c1:#C08A0E; --c2:#CC4FA8; --c3:#E0621F; --c4:#4C86E8;
  --chart-a:#8593AA; --chart-b:#7FA8F2; --plate:#4A7BD6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--font-display);letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:1.85rem;font-weight:700}
h2{font-size:1.3rem;font-weight:600}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
.num,.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.muted{color:var(--ink-2)}
.small{font-size:.85rem}

/* Shell */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%;background:linear-gradient(to right,var(--rail) 248px,transparent 248px)}
.rail{background:var(--rail);color:var(--on-rail);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.mark{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,#C8102E 0 50%,#1F3A6B 50% 100%);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;color:#fff;font-size:.95rem;flex:none}
.brand b{font-family:var(--font-display);font-size:1.05rem;letter-spacing:.06em;display:block;line-height:1.1}
.brand span{font-size:.72rem;color:var(--on-rail-2);letter-spacing:.08em;text-transform:uppercase}
.navgroup{display:flex;flex-direction:column;gap:2px}
.navgroup .eyebrow{color:var(--on-rail-2);padding:0 10px 6px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--on-rail);text-decoration:none;font-size:.93rem;border:0;background:none;text-align:left;width:100%}
.nav svg{width:18px;height:18px;flex:none;opacity:.85}
.nav:hover{background:var(--rail-2)}
.nav[aria-current="page"]{background:var(--rail-2);box-shadow:inset 3px 0 0 #E2334F}
.nav .count{margin-left:auto;font-family:var(--font-mono);font-size:.75rem;background:#C8102E;color:#fff;border-radius:999px;padding:0 7px}
.rail-foot{margin-top:auto;font-size:.75rem;color:var(--on-rail-2);padding:0 8px;line-height:1.45}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 28px}
.topbar .tenant{display:flex;flex-direction:column;min-width:0}
.topbar .tenant b{font-family:var(--font-display);font-size:1.05rem;letter-spacing:.03em}
.topbar .tenant span{font-size:.78rem;color:var(--ink-3)}
.topbar .spacer{flex:1}
.viewas{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 14px}
.viewas label{font-size:.78rem;color:var(--ink-3);white-space:nowrap}
.viewas select{border:0;background:var(--surface-2);border-radius:999px;padding:6px 10px;font-weight:600;font-size:.85rem;max-width:56vw}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.75rem;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);white-space:nowrap}
.chip.demo{border-style:dashed}
.content{padding:24px 28px 56px;display:flex;flex-direction:column;gap:22px;max-width:1440px;width:100%}
.pagehead{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.pagehead p{max-width:68ch}
.scope{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--focus);border-radius:8px;padding:10px 14px;font-size:.88rem}

/* Building blocks */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-family:var(--font-display);font-size:2rem;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:1rem;color:var(--ink-3);font-weight:600}
.kpi .d{font-size:.8rem;color:var(--ink-2)}
.kpi.alert{border-color:color-mix(in srgb,var(--crit) 45%,var(--line))}
.kpi.alert .v{color:var(--crit)}
.cols-2{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.cols-2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.companies{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.co{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.co::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--cc)}
.co-h{display:flex;align-items:center;gap:8px}
.co-h b{font-family:var(--font-display);font-size:1.1rem;letter-spacing:.02em}
.co-h span{font-size:.78rem;color:var(--ink-3)}
.co-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.co-stats div{display:flex;flex-direction:column}
.co-stats b{font-family:var(--font-mono);font-size:1.05rem;font-variant-numeric:tabular-nums}
.co-stats span{font-size:.72rem;color:var(--ink-3)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--cc);display:inline-block;flex:none}
.c1{--cc:var(--c1)}.c2{--cc:var(--c2)}.c3{--cc:var(--c3)}.c4{--cc:var(--c4)}
.spark{width:100%;height:auto;display:block;overflow:visible}
.companies.single{grid-template-columns:minmax(0,440px)}
.spark text{font-family:var(--font-mono);font-size:11px;fill:var(--ink-2)}

/* status pills */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:.74rem;font-weight:600;white-space:nowrap}
.s-ok{background:var(--ok-bg);color:var(--ok)}
.s-warn{background:var(--warn-bg);color:var(--warn)}
.s-crit{background:var(--crit-bg);color:var(--crit)}
.s-idle{background:var(--idle-bg);color:var(--idle)}
.s-info{background:color-mix(in srgb,var(--focus) 14%,transparent);color:var(--focus)}

/* posto board */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:0 22px}
.brow{display:grid;grid-template-columns:minmax(90px,128px) minmax(0,1fr);align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);min-width:0}
.pps{display:flex;flex-wrap:wrap;gap:4px}
.brow .n{font-size:.84rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp{display:inline-flex;align-items:center;gap:3px;height:22px;padding:0 6px;border-radius:6px;font-size:.72rem;font-weight:700;border:1px solid transparent}
.pp .dot{width:7px;height:7px}
.pp.s-ok{border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.pp.s-crit{border-color:var(--crit);animation:pulse 1.6s ease-in-out infinite}
.pp.s-warn{border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
@keyframes pulse{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--crit) 22%,transparent)}}
@media (prefers-reduced-motion: reduce){.pp.s-crit{animation:none}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600;background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.c,th.c{text-align:center}
.cell{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-width:64px;height:28px;border-radius:7px;font-family:var(--font-mono);font-size:.8rem;font-weight:500;background:color-mix(in srgb,var(--cc) 14%,var(--surface));color:var(--ink);border:1px solid color-mix(in srgb,var(--cc) 45%,transparent)}
.cell.opp{background:transparent;border:1px dashed var(--line-2);color:var(--ink-3);font-family:var(--font-body);font-size:.74rem}
.ipo-low{color:var(--crit);font-weight:700}

/* alerts */
.alerts{display:flex;flex-direction:column;gap:10px}
.al{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:0 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.al .stripe{background:var(--sev)}
.al .body{padding:12px 0;display:flex;flex-direction:column;gap:6px;min-width:0}
.al .t{font-weight:600}
.al .meta{font-size:.8rem;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.al .acts{padding:12px 14px 12px 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end;max-width:420px}
.sev-crit{--sev:var(--crit)}.sev-high{--sev:var(--c3)}.sev-med{--sev:var(--warn)}.sev-low{--sev:var(--idle)}
.sla{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;max-width:320px}
.sla i{display:block;height:100%;background:var(--sev);border-radius:999px}
.chain{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:.72rem}
.chain span{padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--ink-3)}
.chain span.done{background:var(--surface-2);color:var(--ink-2)}
.chain span.now{border-color:var(--sev);color:var(--ink);font-weight:700}
.chain em{color:var(--ink-3);font-style:normal}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:.82rem;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,var(--line))}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.fbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.82rem}
.fbtn[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}

/* study */
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;text-align:left}
.tab b{font-family:var(--font-display);font-size:1.02rem}
.tab span{display:block;font-size:.74rem;color:var(--ink-3)}
.tab[aria-selected="true"]{border-color:var(--cc);box-shadow:inset 0 -3px 0 var(--cc)}
.study{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.study .panel ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.study .panel li{font-size:.9rem}
.study .panel.ask{border-style:dashed;box-shadow:none;background:transparent;grid-column:1 / -1}
.study .panel.ask ul{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:6px 28px}
.factrow{display:flex;flex-wrap:wrap;gap:8px 22px}
.factrow div{display:flex;flex-direction:column}
.factrow b{font-family:var(--font-display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.factrow span{font-size:.75rem;color:var(--ink-3)}
.tagline{display:flex;flex-wrap:wrap;gap:6px}
.tagline .chip{font-weight:500;white-space:normal}

/* plan */
.phases{display:flex;flex-direction:column;gap:0;position:relative}
.ph{display:grid;grid-template-columns:120px 28px minmax(0,1fr);gap:0 12px;min-width:0}
.ph .when{font-family:var(--font-mono);font-size:.78rem;color:var(--ink-3);padding-top:18px;text-align:right}
.ph .node{position:relative;display:flex;justify-content:center}
.ph .node::before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--line-2)}
.ph:first-child .node::before{top:22px}
.ph:last-child .node::before{bottom:calc(100% - 22px)}
.ph .node i{position:relative;margin-top:16px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--ink-2)}
.ph.now .node i{border-color:var(--crit);background:var(--crit)}
.ph .card{margin:8px 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.ph .card ul{margin:0;padding-left:18px;font-size:.88rem;display:flex;flex-direction:column;gap:3px}
.ph .deliv{font-size:.84rem;color:var(--ink-2);border-top:1px dashed var(--line);padding-top:8px}
.sprints{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.sprints div{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:.82rem}
.sprints b{display:block;font-family:var(--font-display);font-size:.95rem}

/* economy */
.inputs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.78rem;color:var(--ink-2);font-weight:600}
.field input{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:8px 10px;font-family:var(--font-mono);font-variant-numeric:tabular-nums;width:100%}
.big{font-family:var(--font-display);font-size:2.4rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.big.good{color:var(--ok)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--font-mono);font-size:11px;fill:var(--ink-3)}
.chart .lbl{font-family:var(--font-body);font-size:12px;font-weight:600;fill:var(--ink)}
.swatch{width:14px;height:3px;border-radius:2px;display:inline-block;background:var(--sw)}

/* phones */
.phones{display:flex;flex-wrap:wrap;gap:18px;justify-content:flex-start}
.phone-wrap{display:flex;flex-direction:column;gap:10px;width:256px;max-width:100%}
.phone{width:256px;max-width:100%;border-radius:34px;background:#0B1220;padding:10px;box-shadow:var(--shadow)}
.screen{border-radius:26px;background:var(--bg);overflow:hidden;min-height:520px;display:flex;flex-direction:column}
.sbar{display:flex;justify-content:space-between;padding:8px 18px 4px;font-family:var(--font-mono);font-size:.7rem;color:var(--ink-2)}
.apphead{background:#0E1B33;color:#E9EEF6;padding:12px 16px 14px;display:flex;flex-direction:column;gap:2px}
.apphead b{font-family:var(--font-display);font-size:1.05rem}
.apphead span{font-size:.72rem;color:#9DAECB}
.abody{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:.8rem}
.acard b{font-size:.86rem}
.abtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.abtn{border-radius:12px;padding:12px 8px;font-size:.78rem;font-weight:700;text-align:center;border:1px solid var(--line);background:var(--surface)}
.abtn.sos{background:#C8102E;color:#fff;border-color:#C8102E;grid-column:1 / -1}
.offline{font-size:.72rem;background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:6px 10px;font-weight:600}
.tabbar{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface);font-size:.65rem;color:var(--ink-3);text-align:center;padding:8px 0 10px}
.tabbar b{color:var(--ink)}
.cp{display:flex;align-items:center;gap:8px;font-size:.8rem;padding:6px 0;border-bottom:1px dashed var(--line)}
.cp i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:.65rem;font-weight:700;flex:none}
.cp .ok{background:var(--ok-bg);color:var(--ok)}
.cp .pend{background:var(--idle-bg);color:var(--idle)}
.cp .next{background:var(--warn-bg);color:var(--warn)}
.progress{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ok)}
.wave{display:flex;gap:3px;align-items:center;height:34px;justify-content:center}
.wave i{width:4px;border-radius:2px;background:#C8102E;display:block}
.field-chip{display:flex;justify-content:space-between;gap:8px;font-size:.76rem;border-bottom:1px dashed var(--line);padding:4px 0}
.field-chip span{color:var(--ink-3)}
.field-chip.stack{flex-direction:column;gap:2px}
.field-chip.stack b{text-align:left;font-weight:600}

/* portal */

<script>
(function(){
"use strict";
/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const fmt = n => Number(n).toLocaleString('pt-BR');
const brl = n => Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const mil = n => 'R$ ' + (Math.round(n/1000)).toLocaleString('pt-BR') + ' mil';
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const R = rng(20261002);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const ICON = {
  visao:'<path d="M3 13h8V3H3v10Zm0 8h8v-6H3v6Zm10 0h8V11h-8v10Zm0-18v6h8V3h-8Z"/>',
  condominios:'<path d="M4 21V5l7-2v18M11 21h9V9l-9-2M7 8h1M7 12h1M7 16h1M14 12h3M14 16h3"/>',
  alertas:'<path d="M12 3 2 20h20L12 3Zm0 6v5m0 3v.5"/>',
  portal:'<path d="M3 4h18v12H3zM8 20h8M12 16v4"/>',
  app:'<rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2"/>',
  usuarios:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.8.7 3 2.4 3.5 5.2"/>',
  master:'<path d="M12 2 3 6v6c0 5 3.8 9.3 9 10 5.2-.7 9-5 9-10V6l-9-4Z"/>',
  estudo:'<path d="M4 4h11l5 5v11H4zM15 4v5h5M8 13h8M8 17h6"/>',
  plano:'<path d="M4 6h10M4 12h16M4 18h7"/><circle cx="18" cy="6" r="2"/><circle cx="15" cy="18" r="2"/>',
  economia:'<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',
  notificacoes:'<path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15L6 16ZM10 20.5a2 2 0 0 0 4 0"/>',
  encomendas:'<path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5v-9ZM3 7.5l9 4.5 9-4.5M12 12v9"/>',
  acesso:'<rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="12" cy="10" r="3"/><path d="M8 17c.8-2 2.2-3 4-3s3.2 1 4 3"/>',
  morador:'<path d="M3 11 12 4l9 7M5 10v10h14V10M10 20v-5h4v5"/>',
  funcionalidades:'<path d="M4 5h4v4H4zM10 7h10M4 15h4v4H4zM10 17h10"/>'
};
const svgI = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg>`;

/* ---------- dados ilustrativos ---------- */
const COMPANIES = [
  {id:'infraseg',   name:'Infraseg',    tag:'Infraestrutura em serviços gerais', short:'Portaria e acesso', cls:'c1', L:'I', base:93},
  {id:'fortslimp',  name:'Fortslimp',   tag:'Limpeza e conservação',             short:'Limpeza',           cls:'c2', L:'L', base:89},
  {id:'fortsbravo', name:'Fortsbravo',  tag:'Brigada de incêndio',               short:'Brigada',           cls:'c3', L:'B', base:96},
  {id:'fortservice',name:'Fortservice', tag:'Serviços especializados',           short:'Manutenção',        cls:'c4', L:'S', base:87}
];
const CO = Object.fromEntries(COMPANIES.map(c=>[c.id,c]));
const MAP = {I:'infraseg',L:'fortslimp',B:'fortsbravo',S:'fortservice'};
const CONDOS = [
  ['c1','Residencial Ipê Amarelo','ILBS',240,'Residencial'],
  ['c2','Condomínio Jardim das Acácias','IL',180,'Residencial'],
  ['c3','Edifício Mirante do Vale','ILB',320,'Residencial'],
  ['c4','Residencial Parque dos Ventos','I',96,'Residencial'],
  ['c5','Condomínio Villa Toscana','ILS',150,'Residencial'],
  ['c6','Edifício Solar das Palmeiras','I',64,'Residencial'],
  ['c7','Residencial Grand Brasil','ILBS',410,'Residencial'],
  ['c8','Condomínio Recanto Verde','I',120,'Residencial'],
  ['c9','Edifício Atlântico Office','IB',180,'Comercial'],
  ['c10','Residencial Bosque Imperial','IL',200,'Residencial'],
  ['c11','Condomínio Alto da Serra','I',88,'Residencial'],
  ['c12','Edifício Portal do Sol','IS',72,'Residencial'],
  ['c13','Residencial Vila Romana','IL',160,'Residencial'],
  ['c14','Condomínio Reserva das Flores','I',110,'Residencial'],
  ['c15','Edifício Torre Azul Corporate','ILB',220,'Comercial'],
  ['c16','Residencial Morada do Lago','IS',140,'Residencial'],
  ['c17','Condomínio Quinta da Mata','I',52,'Residencial'],
  ['c18','Residencial Nova Aliança','ILB',260,'Residencial']
].map(([id,name,code,size,kind])=>({id,name,code,size,kind,svc:{}}));
const CD = Object.fromEntries(CONDOS.map(c=>[c.id,c]));

const hour = new Date().getHours();
const isDay = hour>=7 && hour<19;
CONDOS.forEach(c=>{
  for(const ch of c.code){
    const id = MAP[ch]; let postos, colab, desc, h24;
    if(id==='infraseg'){postos=c.size>250?3:c.size>120?2:1;colab=postos*4;desc='Portaria 24h · escala 12x36';h24=true;}
    if(id==='fortslimp'){postos=Math.max(1,Math.ceil(c.size/90));colab=postos;desc='Limpeza diurna · 44h semanais';h24=false;}
    if(id==='fortsbravo'){h24=c.size>300||c.kind==='Comercial';postos=1;colab=h24?4:2;desc=h24?'Bombeiro civil 24h · 12x36':'Bombeiro civil diurno';}
    if(id==='fortservice'){postos=1;colab=1;desc='Zeladoria técnica diurna';h24=false;}
    const ipo = clamp(Math.round(CO[id].base + (R()*8-4)),70,99);
    const tasks = postos*({infraseg:14,fortslimp:18,fortsbravo:10,fortservice:6}[id]);
    c.svc[id] = {postos,colab,desc,h24,ipo,tasks};
  }
});
CD.c13.svc.infraseg.ipo = 74; CD.c11.svc.infraseg.ipo = 81; CD.c16.svc.fortservice.ipo = 79;
CONDOS.forEach(c=>Object.values(c.svc).forEach(s=>{
  s.done = Math.round(s.tasks*s.ipo/100*.93);
  s.missed = Math.round(s.tasks*(100-s.ipo)/100*.6);
  s.pending = Math.max(0,s.tasks-s.done-s.missed);
}));
/* postos individuais e estado agora */
const POSTOS = [];
CONDOS.forEach(c=>Object.entries(c.svc).forEach(([id,s])=>{
  for(let i=1;i<=s.postos;i++){
    let st = (s.h24 || isDay) ? 'ok' : 'idle';
    POSTOS.push({condo:c.id,company:id,idx:i,desc:s.desc,status:st});
  }
}));
const setSt=(c,co,i,st)=>{const p=POSTOS.find(p=>p.condo===c&&p.company===co&&p.idx===i);if(p)p.status=st;};
setSt('c13','infraseg',2,'crit'); setSt('c17','infraseg',1,'warn'); setSt('c9','fortsbravo',1,'warn');

/* tendência 14 dias por empresa */
const TREND = {};
COMPANIES.forEach(co=>{const r=rng(co.base*97);TREND[co.id]=Array.from({length:14},(_,i)=>clamp(Math.round(co.base-2+r()*5+(i>9?1:0)),70,100));});
TREND.infraseg[13]=91;

const ALERTS = [
  {id:1,sev:'crit',t:'Posto descoberto',d:'Portaria · posto 2 · turno 12x36 sem check-in',condo:'c13',company:'infraseg',open:38,sla:15,status:'escalado',step:5,who:'Anderson Lima (coordenador)'},
  {id:2,sev:'high',t:'Ronda perimetral incompleta',d:'3 de 8 pontos NFC lidos na ronda das 02:00',condo:'c11',company:'infraseg',open:24,sla:30,status:'novo',step:1,who:''},
  {id:3,sev:'high',t:'Extintor com recarga vencida',d:'Torre B · 3º andar · venceu há 4 dias',condo:'c9',company:'fortsbravo',open:95,sla:240,status:'assumido',step:1,who:'Fernanda Alves'},
  {id:4,sev:'med',t:'Aparelho do posto sem sinal',d:'Último envio há 22 min · 2 registros na fila',condo:'c17',company:'infraseg',open:22,sla:30,status:'novo',step:1,who:''},
  {id:5,sev:'med',t:'Insumo abaixo do mínimo',d:'Papel toalha e desinfetante · estoque para 2 dias',condo:'c10',company:'fortslimp',open:180,sla:1440,status:'assumido',step:1,who:'Paula Ribeiro'},

  {id:7,sev:'med',t:'Chamado do síndico: bomba de recalque com ruído',d:'Aberto pelo portal do cliente · foto anexada',condo:'c16',company:'fortservice',open:70,sla:240,status:'novo',step:1,who:''},

function scopeNote(){const s=ROLES[state.role].scope;return s?`<div class="scope"><b style="white-space:nowrap">Escopo do perfil</b><span>${s}</span></div>`:'';}
function sparkline(values,co){
  const w=240,h=52,pad=4,lab=34,min=Math.min(...values)-2,max=Math.max(...values)+1;
  const x=i=>pad+i*(w-pad*2-lab)/(values.length-1), y=v=>h-6-(v-min)/(max-min)*(h-14);
  const pts=values.map((v,i)=>[x(i),y(v)]);
  const line=pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area=`M${pts[0][0]},${h-3} L`+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L')+` L${pts[pts.length-1][0]},${h-3} Z`;
  const L=pts[pts.length-1];
  return `<svg class="spark ${co.cls}" viewBox="0 0 ${w} ${h}" data-spark="${values.join(',')}" data-name="${co.name}" role="img" aria-label="Cumprimento dos últimos 14 dias da ${co.name}, hoje ${values[values.length-1]}%">
    <line x1="${pad}" x2="${w-lab}" y1="${y(90).toFixed(1)}" y2="${y(90).toFixed(1)}" stroke="var(--line)" stroke-dasharray="3 3"/>
    <path d="${area}" fill="var(--cc)" fill-opacity=".12"/>
    <polyline points="${line}" fill="none" stroke="var(--cc)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${L[0].toFixed(1)}" cy="${L[1].toFixed(1)}" r="3.5" fill="var(--cc)" stroke="var(--surface)" stroke-width="2"/>
    <text x="${(L[0]+7).toFixed(1)}" y="${(L[1]+4).toFixed(1)}">${values[values.length-1]}%</text></svg>`;
}
const pct = (a,b) => b ? Math.round(a/b*100) : 0;
function statusPill(st){return {ok:'<span class="pill s-ok">✓ Coberto</span>',warn:'<span class="pill s-warn">! Sem sinal</span>',crit:'<span class="pill s-crit">✕ Descoberto</span>',idle:'<span class="pill s-idle">– Fora de turno</span>'}[st];}
function stIcon(st){return {ok:'✓',warn:'!',crit:'✕',idle:'–'}[st];}
function stLabel(st){return {ok:'coberto',warn:'sem sinal',crit:'descoberto',idle:'fora de turno'}[st];}
function fmtMin(m){return m<1?'agora':m<60?m+' min':m<1440?Math.floor(m/60)+'h'+(m%60?String(m%60).padStart(2,'0'):''):Math.floor(m/1440)+' d';}

  ].join('');

    a=alerts.filter(x=>x.company===co.id).length;

    <div class="panel"><div class="panel-h"><h2>Alertas abertos</h2><button class="btn" data-go="alertas">Abrir central</button></div>

  </section>
  <section class="panel"><div class="panel-h"><h2>Onde olhar primeiro</h2><span class="small muted">Menor índice de performance operacional (IPO) do mês</span></div>
    <div class="tbl-wrap"><table><thead><tr><th>Condomínio</th><th>Empresa</th><th>Serviço</th><th class="c">IPO</th><th class="c">Tarefas hoje</th><th class="c">Não realizadas</th></tr></thead><tbody>
    ${low.slice(0,6).map(({c,id,s})=>`<tr><td>${esc(c.name)}</td><td><span class="dot ${CO[id].cls}"></span> ${CO[id].name}</td><td class="muted">${s.desc}</td><td class="c num ${s.ipo<85?'ipo-low':''}">${s.ipo}%</td><td class="c num">${s.done}/${s.tasks}</td><td class="c num">${s.missed}</td></tr>`).join('')}

function portariaHoje(){

function alertStatus(a){return state.alertState[a.id]||a.status;}
function vAlertas(){

    const stPill = st==='novo'?'<span class="pill s-crit">Aguardando aceite</span>':st==='assumido'?`<span class="pill s-info">Assumido · ${esc(a.who||'você')}</span>`:st==='escalado'?`<span class="pill s-warn">Escalonado · ${esc(a.who)}</span>`:'<span class="pill s-ok">✓ Encerrado com evidência</span>';
    return `<article class="al ${s[2]}"><div class="stripe"></div><div class="body">

      <div class="chain">${CHAIN.map((x,i)=>`<span class="${i+1<a.step?'done':i+1===a.step?'now':''}">${x}</span>${i<CHAIN.length-1?'<em>→</em>':''}`).join('')}</div>
    </div><div class="acts">${st==='encerrado'?'':`${st==='novo'?`<button class="btn primary" data-act="assumir" data-id="${a.id}">Assumir</button>`:''}<button class="btn" data-act="escalar" data-id="${a.id}">Escalonar</button><button class="btn" data-act="encerrar" data-id="${a.id}">Encerrar com evidência</button>`}</div></article>`;
  };
  const btn=(k,l)=>`<button class="fbtn" data-filter="${k}" aria-pressed="${f===k}">${l}</button>`;
  return `${scopeNote()}

const ECO={W:920,H:300,L:70,R:150};
let eco = {n:18, atual:900, nova:450, impl:60000, overlap:1, h:24};
function ecoCalc(){
  const A=eco.n*eco.atual, N=eco.n*eco.nova, months=[];
  let be=null;
  for(let m=0;m<=eco.h;m++){
    const cur=A*m, nw=eco.impl+N*m+A*Math.min(m,eco.overlap);
    months.push({m,cur,nw});
    if(be===null && m>0 && nw<=cur) be=m;
  }
  // ponto exato de equilíbrio
  let exact=null; if(A-N>0){exact=(eco.impl+A*eco.overlap)/(A-N);}
  return {A,N,months,be,exact,save:A-N};
}
function ecoChart(c){
  const W=ECO.W,H=ECO.H,L=ECO.L,Rr=ECO.R,T=16,B=34,maxV=Math.max(...c.months.map(p=>Math.max(p.cur,p.nw)))*1.08;
  const x=m=>L+m*(W-L-Rr)/eco.h, y=v=>H-B-(v/maxV)*(H-B-T);
  const step=niceStep(maxV/4), ticks=[];for(let v=0;v<=maxV;v+=step)ticks.push(v);
  const path=k=>c.months.map((p,i)=>(i?'L':'M')+x(p.m).toFixed(1)+','+y(p[k]).toFixed(1)).join(' ');
  const last=c.months[c.months.length-1];
  const xt=[];for(let m=0;m<=eco.h;m+=eco.h>24?12:6)xt.push(m);
  const ex=c.exact!==null&&c.exact<=eco.h?c.exact:null;
  let ly1=y(last.cur), ly2=y(last.nw); if(Math.abs(ly1-ly2)<16){ if(ly1<ly2) ly2=ly1+16; else ly1=ly2+16; }
  return `<svg class="chart" id="eco-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Custo acumulado em ${eco.h} meses: plataforma atual ${mil(last.cur)}, nova plataforma ${mil(last.nw)}">
    ${ticks.map(v=>`<line x1="${L}" x2="${W-Rr}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--line)" ${v?'stroke-dasharray="2 4"':''}/><text x="${L-8}" y="${(y(v)+4).toFixed(1)}" text-anchor="end">${v?Math.round(v/1000)+' mil':'0'}</text>`).join('')}
    ${xt.map(m=>`<text x="${x(m).toFixed(1)}" y="${H-B+18}" text-anchor="middle">${m===0?'início':'mês '+m}</text>`).join('')}
    ${ex!==null?`<line x1="${x(ex).toFixed(1)}" x2="${x(ex).toFixed(1)}" y1="${T}" y2="${H-B}" stroke="var(--ok)" stroke-dasharray="4 3"/><text x="${(x(ex)+6).toFixed(1)}" y="${T+10}" style="fill:var(--ok)">equilíbrio · mês ${ex.toFixed(1).replace('.',',')}</text>`:''}
    <path d="${path('cur')}" fill="none" stroke="var(--chart-a)" stroke-width="2" stroke-linejoin="round"/>
    <path d="${path('nw')}" fill="none" stroke="var(--chart-b)" stroke-width="2.4" stroke-linejoin="round"/>
    <circle cx="${x(last.m)}" cy="${y(last.cur)}" r="4" fill="var(--chart-a)" stroke="var(--surface)" stroke-width="2"/>
    <circle cx="${x(last.m)}" cy="${y(last.nw)}" r="4" fill="var(--chart-b)" stroke="var(--surface)" stroke-width="2"/>
    <text class="lbl" x="${x(last.m)+10}" y="${ly1+4}">Atual ${mil(last.cur)}</text>
    <text class="lbl" x="${x(last.m)+10}" y="${ly2+4}">Nova ${mil(last.nw)}</text>
    <line id="eco-x" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="var(--ink-3)" stroke-width="1" opacity="0"/>
    <rect x="${L}" y="${T}" width="${W-L-Rr}" height="${H-B-T}" fill="transparent" id="eco-hit"/>
  </svg>`;
}
function niceStep(raw){const p=Math.pow(10,Math.floor(Math.log10(raw)));const n=raw/p;return (n<1.5?1:n<3?2:n<7?5:10)*p;}

function qrSvg(){
  const r=rng(42), n=21, s=6; let cells='';
  const fin=(x,y)=>`<rect x="${x*s}" y="${y*s}" width="${7*s}" height="${7*s}" fill="#0E1B33"/><rect x="${(x+1)*s}" y="${(y+1)*s}" width="${5*s}" height="${5*s}" fill="#fff"/><rect x="${(x+2)*s}" y="${(y+2)*s}" width="${3*s}" height="${3*s}" fill="#0E1B33"/>`;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){ const inF=(x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12); if(!inF&&r()>.52) cells+=`<rect x="${x*s}" y="${y*s}" width="${s}" height="${s}" fill="#0E1B33"/>`; }
  return `<svg class="qr" viewBox="0 0 ${n*s} ${n*s}" role="img" aria-label="QR de retirada ilustrativo">${cells}${fin(0,0)}${fin(14,0)}${fin(0,14)}</svg>`;
}

function audOptions(){

}
function reach(){
  const sc = state.role==='sindico'?[CD.c1]:NOTIF.where==='all'?scopeCondos():[CD[NOTIF.where]||CD.c1];

  if(NOTIF.to==='sindicos') return `${sc.length} síndico${sc.length>1?'s':''}`;
  if(NOTIF.to==='colaboradores') { const r=ROLES[state.role]; const n=sc.reduce((a,c)=>a+Object.entries(c.svc).filter(([id])=>!r.company||id===r.company).reduce((b,[,s])=>b+s.colab,0),0); return `${fmt(n)} colaboradores`; }

}

const tip=$('#tip');
function showTip(html,ev){tip.innerHTML=html;tip.hidden=false;const w=tip.offsetWidth,h=tip.offsetHeight;let x=ev.clientX+14,y=ev.clientY+14;if(x+w>innerWidth-8)x=ev.clientX-w-14;if(y+h>innerHeight-8)y=ev.clientY-h-14;tip.style.left=x+'px';tip.style.top=y+'px';}
function hideTip(){tip.hidden=true;}
document.addEventListener('mousemove',e=>{
  const t=e.target.closest('[data-tip]'); if(t){showTip(esc(t.dataset.tip),e);return;}
  const sp=e.target.closest('[data-spark]');
  if(sp){const vals=sp.dataset.spark.split(',').map(Number);const r=sp.getBoundingClientRect();const sc=r.width/240;const i=clamp(Math.round(((e.clientX-r.left)/sc-4)/((240-8-34)/(vals.length-1))),0,vals.length-1);const d=new Date();d.setDate(d.getDate()-(vals.length-1-i));showTip(`<b>${sp.dataset.name}</b><br>${d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})} · ${vals[i]}% de cumprimento`,e);return;}
  const hit=e.target.closest('#eco-hit');
  if(hit){const svg=hit.ownerSVGElement, r=svg.getBoundingClientRect(), W=ECO.W, L=ECO.L, Rr=ECO.R; const px=(e.clientX-r.left)*(W/r.width); const m=clamp(Math.round((px-L)/(W-L-Rr)*eco.h),0,eco.h); const c=ecoCalc(), p=c.months[m]; const xl=document.getElementById('eco-x'); const xx=L+m*(W-L-Rr)/eco.h; xl.setAttribute('x1',xx);xl.setAttribute('x2',xx);xl.setAttribute('opacity','.6'); showTip(`<b>${m===0?'Início':'Mês '+m}</b><br>Atual: ${brl(p.cur)}<br>Nova: ${brl(p.nw)}<br>Diferença: ${brl(p.cur-p.nw)}`,e);return;}
  hideTip(); const xl=document.getElementById('eco-x'); if(xl) xl.setAttribute('opacity','0');
});
document.addEventListener('mouseleave',hideTip);
